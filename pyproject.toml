[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-tool-graph"
version = "0.1.0"
description = "Declarative tool prerequisites for agent workflows"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "MukundaKatta"}]
keywords = ["agent", "tools", "dependency", "graph", "llm", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/MukundaKatta/agent-tool-graph"
Repository = "https://github.com/MukundaKatta/agent-tool-graph"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_tool_graph = ["py.typed"]
